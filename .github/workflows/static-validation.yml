name: Static landing validation
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No untrusted event fields are interpolated into shell commands.
      - name: Validate static content and JavaScript syntax
        run: python3 -B tools/validate.py
      - name: Check patch whitespace
        run: git show --format= --check HEAD
