<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Cena cultural noturna de Porto Alegre</title>
  <desc id="desc">Colagem abstrata com rua, cartazes, fachada, luz urbana e mapa sutil.</desc>
  <defs>
